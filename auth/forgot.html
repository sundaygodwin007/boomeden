<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <link rel="stylesheet" href="auth.css">

</head>
<body>
<div class="auth-container">
  <h1 id="header1">BOOMEDEN</h1>
  <h2>Forgot Password</h2>
  <input id="resetEmail" type="email" placeholder="Enter your email">
  <button id="sendOtpBtn">Send OTP</button>
  <!-- this area is filled by forgot.js after the server sends the verification code. -->
  <div id="otpStep" style="display:none;">
    <input id="resetOtp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6 digit OTP">
    <button id="verifyOtpBtn" type="button">Verify OTP</button>
  </div>
</div>

<!-- Firebase v8 - NO MODULES -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>

<!-- THIS IS THE IMPORTANT ONE - LOAD YOUR JS -->
<script src="forgot.js"></script>  
</body>
</html>
