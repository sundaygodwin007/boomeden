<!DOCTYPE html>
<html>
<head>
  <title>Reset Password - BoomedEN</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="password">
      <center>
      <h1>Reset Password</h1>
      <p id="emailText">Resetting password for: </p><br>
    </center>
  
    <input type="password" id="password" placeholder="Enter New Password"><br><br>
    <input type="password" id="confirm" placeholder="Confirm New Password"><br><br>
    <button id="reset" type="button">Reset</button>

    <p id="loading" style="display:none; color:green;">Updating password...</p>
  </div>

  <script type="module" src="resetpassword.js"></script>
</body>
</html>
