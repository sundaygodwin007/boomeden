<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boomeden</title>
</head>
<body>
  <!-- this chooses the mobile or desktop starting page without forcing every visitor through signup. -->
  <script>
    const firstPage = window.innerWidth <= 768
      ? 'interlock/interlock.html'
      : 'ecosystem/ecosystem.html';

    window.location.replace(firstPage);
  </script>
</body>
</html>
